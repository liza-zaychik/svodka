<title>Svodka</title>

<style>
  :root {
    --bg:#fff; --fg:#191919; --muted:#6f6f6f; --line:#e6e6e6; --card:#fafafa;
    --red:#c0392b; --green:#1a7f4b; --amber:#a35a00; --blue:#2f5fd0; --chip:#f2f2f2;
    --onc:#fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151719; --fg:#ededed; --muted:#9b9b9b; --line:#2b2e32; --card:#1c1f22;
            --red:#ef8279; --green:#5fd39b; --amber:#e0a34a; --blue:#7ea6ff; --chip:#24282c;
            --onc:#151719; }
  }
  :root[data-theme="light"]{--bg:#fff;--fg:#191919;--muted:#6f6f6f;--line:#e6e6e6;--card:#fafafa;--red:#c0392b;--green:#1a7f4b;--amber:#a35a00;--blue:#2f5fd0;--chip:#f2f2f2;--onc:#fff;}
  :root[data-theme="dark"]{--bg:#151719;--fg:#ededed;--muted:#9b9b9b;--line:#2b2e32;--card:#1c1f22;--red:#ef8279;--green:#5fd39b;--amber:#e0a34a;--blue:#7ea6ff;--chip:#24282c;--onc:#151719;}

  body { background:var(--bg); color:var(--fg); margin:0; padding:18px 14px 120px;
         font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:21px; margin:0 0 2px; }
  .date { color:var(--muted); font-size:14px; margin:0 0 16px; }

  .tiles { display:flex; gap:8px; margin-bottom:8px; }
  .tile { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 8px; text-align:center; }
  .tile b { display:block; font-size:22px; line-height:1.1; }
  .tile span { font-size:11px; color:var(--muted); }

  .note, .status { font-size:13px; color:var(--muted); background:var(--card);
                   border:1px solid var(--line); border-radius:10px; padding:10px 12px;
                   margin-bottom:16px; }
  .status.err { color:var(--red); }

  h2 { font-size:15px; margin:24px 0 8px; display:flex; align-items:baseline; gap:8px; }
  h2 .n { font-size:12px; color:var(--muted); font-weight:400; }
  .hint { font-size:12.5px; color:var(--muted); margin:-4px 0 10px; }

  .mail { border-top:1px solid var(--line); padding:11px 0 12px; }
  .mail:last-child { border-bottom:1px solid var(--line); }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .from { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .when { font-size:12px; color:var(--muted); white-space:nowrap; }
  .subj { font-weight:600; font-size:15px; margin:2px 0 1px; }
  .gist { font-size:14px; color:var(--muted); }
  .why { font-size:13px; color:var(--amber); margin-top:4px; }

  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .chip { font:inherit; font-size:13px; line-height:1; text-decoration:none;
          background:var(--chip); color:var(--fg); border:1px solid var(--line);
          border-radius:999px; padding:8px 13px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .chip:disabled { opacity:.45; cursor:default; }
  .tone { color:var(--c); background:color-mix(in srgb, var(--c) 9%, transparent);
          border-color:color-mix(in srgb, var(--c) 45%, var(--line)); }
  .tone[aria-pressed="true"] { background:var(--c); color:var(--onc); border-color:var(--c); }
  .t-open { --c:var(--blue); } .t-keep { --c:var(--green); }
  .t-later { --c:var(--amber); } .t-trash { --c:var(--red); }

  .state { font-size:13px; margin-top:7px; }
  .state.ok { color:var(--green); }
  .state.err { color:var(--red); }
  .done .subj, .done .gist, .done .from { opacity:.5; }

  .marked { border-top:1px solid var(--line); padding:8px 0; }
  .marked:last-child { border-bottom:1px solid var(--line); }
  .msubj { font-size:14px; color:var(--fg); text-decoration:none; }
  .mfrom { font-size:13px; color:var(--muted); }
  .mwhy { font-size:12.5px; color:var(--muted); margin-top:2px; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bg);
         border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
         display:none; }
  .bar .inner { max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .bar button { font:inherit; font-weight:600; font-size:15px; color:#fff; background:var(--blue);
                border:0; border-radius:10px; padding:13px 18px; cursor:pointer; flex:1; }
  .bar button:disabled { opacity:.4; cursor:default; }
  .bar .reset { flex:0 0 auto; background:transparent; color:var(--muted); font-weight:400;
                border:1px solid var(--line); padding:13px 14px; }
  .barnote { max-width:560px; margin:6px auto 0; font-size:12px; color:var(--muted); text-align:center; }

  footer { margin-top:32px; font-size:12.5px; color:var(--muted);
           border-top:1px solid var(--line); padding-top:12px; }
</style>
<main>
  <h1 id="title"></h1>
  <p class="date" id="date"></p>

  <div id="status" class="status"></div>

  <div class="tiles" id="tiles" hidden>
    <div class="tile"><b id="t-marked">0</b><span id="l-marked"></span></div>
    <div class="tile"><b id="t-act">0</b><span id="l-act"></span></div>
    <div class="tile"><b id="t-unread">0</b><span id="l-unread"></span></div>
  </div>

  <div class="note" id="note" hidden></div>

  <div id="sections"></div>
  <footer id="foot" hidden></footer>
</main>

<div class="bar" id="bar">
  <div class="inner">
    <button id="apply" disabled></button>
    <button id="reset" class="reset"></button>
  </div>
  <div class="barnote" id="barnote"></div>
</div>

<script>
  const SERVER = "Gmail";
  const GM = (id) => "https://mail.google.com/mail/u/0/#all/" + id;

  // Label ids arrive with the summary: every mailbox has its own.
  let labels = { trash: null, done: null };
  let dry = false;

  const I18N = {
    ru: {
      lang: "ru",
      locale: "ru-RU",
      title: "Сводка почты",
      loading: "загружаю…",
      reading: "Читаю свежую сводку из почты…",
      tiles: { marked: "помечено", act: "требует действия", unread: "непрочитанных" },
      note: "Отмечай решения — ничего не происходит, пока не нажмёшь кнопку внизу. Всё обратимо: корзина хранит письма 30 дней, ярлык снимается.",
      dryNote: "Пробный режим: разбор настоящий, но ярлыки в почте не ставились.",
      noDoneLabel: "Кнопка «Оставить» появится после следующего прогона.",
      nothing: "Ничего не выбрано",
      apply: (n) => "Выполнить: " + n,
      applying: (i, n) => "Выполняю " + i + " из " + n,
      done: (ok, failed) => (failed ? "Готово: " + ok + ", с ошибкой: " + failed : "Готово: " + ok),
      reset: "Сбросить",
      later: (n) => "Напомнить позже: " + n + " — придут в следующей сводке",
      undoHint: "Передумаешь — жми «Вернуть» у нужного письма.",
      options: { read: "Оставить · больше не показывать", explain: "Напомнить позже", trash: "В корзину" },
      reply: "Ответить",
      noSubject: "(без темы)",
      why: "Почему сюда: ",
      sections: {
        act: ["🔴 Требует действия", "Ждут ответа, оплаты или есть дедлайн."],
        unread: ["📥 Непрочитанное — важное сверху", ""],
        check: ["❓ Проверить", "Тут разбор не рискнул решать сам."],
        marked: "🗑 Помечено",
      },
      defaultTrash: "🗑 На удаление",
      markedHint: (name) => "Ярлык «" + name + "» уже стоит. Из почты ничего не удалено — почистить можно в Gmail. ",
      markedHintDry: (name) => "Пробный режим: ярлык «" + name + "» не ставился, это только предложение. ",
      openLabel: "Открыть ярлык в Gmail",
      kept: "оставлено · в сводке больше не покажу",
      trashed: "в корзине",
      undo: "Вернуть",
      restored: "возвращено",
      dateLine: (date, made) => "за " + date + (made ? " · собрана " + made : ""),
      noDrafts: "Свежей сводки нет. Она собирается каждое утро — либо прогон ещё не проходил, либо упал.",
      broken: "Сводка в почте есть, но она испорчена — прогон записал не то. Нужен повторный прогон.",
      foot: "Собрано перебором переписок, без поиска по словам. Ссылки из писем не открывались, вложения не читались. Сводка обновляется сама каждое утро.",
      errors: {
        needs_reauth: "Доступ к Gmail истёк — переподключи коннектор в настройках claude.ai.",
        server_not_connected: "Коннектор Gmail не подключён — включи его в настройках claude.ai.",
        selection_required: "Подключено несколько Gmail — надо выбрать один.",
        not_in_manifest: "Странице не выдали доступ к этому действию.",
        blocked: "Заблокировано политикой доступа.",
        no_access: "Здесь страница не может обращаться к почте. Открой её на claude.ai под своим аккаунтом.",
        server_unavailable: "Gmail не ответил, попробуй ещё раз.",
        tool_error: (m) => "Gmail вернул ошибку: " + (m || "без пояснения"),
        other: (c, m) => "Не вышло: " + c + (m ? " — " + m : ""),
      },
    },
    en: {
      lang: "en",
      locale: "en-GB",
      title: "Email summary",
      loading: "loading…",
      reading: "Reading the latest summary from your mail…",
      tiles: { marked: "marked", act: "need action", unread: "unread" },
      note: "Pick your decisions — nothing happens until you press the button below. Everything is reversible: Trash keeps mail for 30 days, labels can be removed.",
      dryNote: "Dry run: the triage is real, but no labels were applied.",
      noDoneLabel: "The “Keep” button appears after the next run.",
      nothing: "Nothing selected",
      apply: (n) => "Apply: " + n,
      applying: (i, n) => "Applying " + i + " of " + n,
      done: (ok, failed) => (failed ? "Done: " + ok + ", failed: " + failed : "Done: " + ok),
      reset: "Reset",
      later: (n) => "Remind me later: " + n + " — they come back in the next summary",
      undoHint: "Changed your mind? Press “Undo” on the message.",
      options: { read: "Keep · don't show again", explain: "Remind me later", trash: "Move to Trash" },
      reply: "Reply",
      noSubject: "(no subject)",
      why: "Why here: ",
      sections: {
        act: ["🔴 Needs action", "Awaiting a reply or a payment, or has a deadline."],
        unread: ["📥 Unread — most important first", ""],
        check: ["❓ To check", "The triage did not dare to decide these on its own."],
        marked: "🗑 Marked",
      },
      defaultTrash: "🗑 To delete",
      markedHint: (name) => "The “" + name + "” label is already applied. Nothing was deleted — clean up in Gmail whenever you like. ",
      markedHintDry: (name) => "Dry run: the “" + name + "” label was not applied, this is only a suggestion. ",
      openLabel: "Open the label in Gmail",
      kept: "kept · won't show again",
      trashed: "in Trash",
      undo: "Undo",
      restored: "restored",
      dateLine: (date, made) => "for " + date + (made ? " · built " + made : ""),
      noDrafts: "No summary yet. It is built every morning — either the run has not happened yet, or it failed.",
      broken: "The summary in your mail is damaged — the run wrote something wrong. Run it again.",
      foot: "Built by going through conversations one by one, not by keyword search. No links were opened and no attachments were read. The summary refreshes itself every morning.",
      errors: {
        needs_reauth: "Gmail access has expired — reconnect the connector in claude.ai settings.",
        server_not_connected: "The Gmail connector is not connected — turn it on in claude.ai settings.",
        selection_required: "Several Gmail connectors are connected — choose one.",
        not_in_manifest: "This page was not given access to that action.",
        blocked: "Blocked by an access policy.",
        no_access: "This page cannot reach your mail here. Open it on claude.ai with your account.",
        server_unavailable: "Gmail did not respond, try again.",
        tool_error: (m) => "Gmail returned an error: " + (m || "no details"),
        other: (c, m) => "Something went wrong: " + c + (m ? " — " + m : ""),
      },
    },
  };

  // Until the summary says which language it is in, follow the browser.
  let T = I18N[(navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en"];

  const mcp = () => (window.claude && window.claude.mcp) ? window.claude.mcp : null;
  const picks = new Map();

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  function applyStatic() {
    document.documentElement.lang = T.lang;
    $("title").textContent = T.title;
    $("date").textContent = T.loading;
    $("status").textContent = T.reading;
    $("l-marked").textContent = T.tiles.marked;
    $("l-act").textContent = T.tiles.act;
    $("l-unread").textContent = T.tiles.unread;
    $("note").textContent = T.note;
    $("apply").textContent = T.nothing;
    $("reset").textContent = T.reset;
  }

  function explain(err) {
    const c = err && err.code;
    const E = T.errors;
    if (c === "needs_reauth") return E.needs_reauth;
    if (c === "server_not_connected") return E.server_not_connected;
    if (c === "selection_required") return E.selection_required;
    if (c === "not_in_manifest") return E.not_in_manifest;
    if (c === "blocked_by_policy" || c === "approval_required") return E.blocked;
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return E.no_access;
    if (c === "server_unavailable") return E.server_unavailable;
    if (c === "tool_error") return E.tool_error(err.message);
    return E.other(c, err && err.message);
  }

  const OPTIONS = [
    { key: "read", tone: "t-keep" },
    { key: "explain", tone: "t-later" },
    { key: "trash", tone: "t-trash" },
  ];

  function row(m, kind) {
    const box = el("div", "mail");
    const top = el("div", "top");
    top.append(el("div", "from", m.from || ""), el("div", "when", m.when || ""));
    box.append(top, el("div", "subj", m.subj || T.noSubject));
    if (m.gist) box.append(el("div", "gist", m.gist));
    if (m.why) box.append(el("div", "why", T.why + m.why));

    const acts = el("div", "acts");
    const state = el("div", "state");
    const rec = { choice: null, box, state, id: m.threadId, buttons: [] };

    const open = el("a", "chip tone t-open", T.reply);
    open.href = GM(m.threadId); open.target = "_blank"; open.rel = "noopener";
    acts.append(open);

    // Without the id of the "done" label the Keep button cannot work — do not show it.
    OPTIONS.filter((o) => o.key !== "read" || (labels.done && labels.done.id)).forEach((opt) => {
      const b = el("button", "chip tone " + opt.tone, T.options[opt.key]);
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => {
        rec.choice = rec.choice === opt.key ? null : opt.key;
        rec.buttons.forEach((x) => x.btn.setAttribute("aria-pressed", String(x.key === rec.choice)));
        state.className = "state"; state.textContent = "";
        refresh();
      });
      rec.buttons.push({ key: opt.key, btn: b });
      acts.append(b);
    });

    picks.set(m.threadId + ":" + kind, rec);
    box.append(acts, state);
    return box;
  }

  function section(kind, items) {
    if (!items || !items.length) return;
    const [title, hint] = T.sections[kind];
    const host = $("sections");
    const h = el("h2", null, title);
    h.append(el("span", "n", String(items.length)));
    host.append(h);
    if (hint) host.append(el("div", "hint", hint));
    items.forEach((m) => host.append(row(m, kind)));
  }

  function markedSection(items) {
    if (!items || !items.length) return;
    const host = $("sections");
    const h = el("h2", null, T.sections.marked);
    h.append(el("span", "n", String(items.length)));
    host.append(h);
    const trashName = (labels.trash && labels.trash.name) || T.defaultTrash;
    const hint = el("div", "hint", dry ? T.markedHintDry(trashName) : T.markedHint(trashName));
    const link = el("a", null, T.openLabel);
    link.href = "https://mail.google.com/mail/u/0/#search/" + encodeURIComponent('label:"' + trashName + '"');
    link.target = "_blank"; link.rel = "noopener";
    hint.append(link);
    host.append(hint);

    items.forEach((m) => {
      const li = el("div", "marked");
      const a = el("a", "msubj", m.subj || T.noSubject);
      a.href = GM(m.threadId); a.target = "_blank"; a.rel = "noopener";
      li.append(a, el("span", "mfrom", " · " + (m.from || "")));
      li.append(el("div", "mwhy", (m.when || "") + " · " + (m.why || "")));
      host.append(li);
    });
  }

  const isWork = (c) => c === "read" || c === "trash";
  const pending = () => [...picks.values()].filter((r) => isWork(r.choice));

  function refresh() {
    const n = pending().length;
    const later = [...picks.values()].filter((r) => r.choice === "explain").length;
    $("apply").disabled = n === 0;
    $("apply").textContent = n === 0 ? T.nothing : T.apply(n);
    $("barnote").textContent = later ? T.later(later) : "";
  }

  async function run(rec) {
    const call = (tool, input) => mcp().callTool(SERVER, tool, input);
    if (rec.choice === "read") {
      await call("label_thread", { threadId: rec.id, labelIds: [labels.done.id] });
      await call("unlabel_thread", { threadId: rec.id, labelIds: ["UNREAD"] });
      return T.kept;
    }
    if (rec.choice === "trash") {
      await call("trash_thread", { threadId: rec.id });
      return T.trashed;
    }
    return "";
  }

  function addUndo(rec) {
    const b = el("button", "chip tone t-open", T.undo);
    b.type = "button";
    b.addEventListener("click", async () => {
      b.disabled = true;
      try {
        if (rec.choice === "trash") {
          // The connector does not allow untrash_thread ("caller does not have permission"),
          // but removing the TRASH system label works.
          await mcp().callTool(SERVER, "unlabel_thread", { threadId: rec.id, labelIds: ["TRASH"] });
        } else {
          await mcp().callTool(SERVER, "unlabel_thread", { threadId: rec.id, labelIds: [labels.done.id] });
          await mcp().callTool(SERVER, "label_thread", { threadId: rec.id, labelIds: ["UNREAD"] });
        }
        rec.state.className = "state"; rec.state.textContent = T.restored;
        rec.box.classList.remove("done");
        b.remove();
      } catch (e) {
        rec.state.className = "state err"; rec.state.textContent = explain(e);
        b.disabled = false;
      }
    });
    rec.box.querySelector(".acts").append(b);
  }

  $("reset").addEventListener("click", () => {
    picks.forEach((r) => {
      if (r.box.classList.contains("done")) return;
      r.choice = null;
      r.buttons.forEach((x) => x.btn.setAttribute("aria-pressed", "false"));
      r.state.className = "state"; r.state.textContent = "";
    });
    refresh();
  });

  $("apply").addEventListener("click", async () => {
    const todo = pending();
    $("apply").disabled = true; $("reset").disabled = true;
    let ok = 0, failed = 0;
    for (const rec of todo) {
      rec.state.className = "state"; rec.state.textContent = "…";
      $("apply").textContent = T.applying(ok + failed + 1, todo.length);
      try {
        rec.state.className = "state ok";
        rec.state.textContent = await run(rec);
        rec.box.classList.add("done");
        rec.buttons.forEach((x) => (x.btn.disabled = true));
        addUndo(rec);
        ok++;
      } catch (e) {
        rec.state.className = "state err"; rec.state.textContent = explain(e);
        failed++;
      }
    }
    $("apply").textContent = T.done(ok, failed);
    $("barnote").textContent = T.undoHint;
    $("reset").disabled = false;
  });

  function fail(text) {
    const s = $("status");
    s.className = "status err";
    s.textContent = text;
    $("date").textContent = "";
  }

  async function load() {
    applyStatic();

    if (!mcp()) {
      fail(T.errors.no_access);
      return;
    }

    let res;
    try {
      // Always fresh: the run rebuilds the summary, a cached answer would only get in the way.
      res = await mcp().callTool(
        SERVER, "list_drafts",
        { query: "subject:SVODKA-DATA", pageSize: 5, view: "DRAFT_VIEW_FULL" },
        { cache: false }
      );
    } catch (e) {
      fail(explain(e));
      return;
    }

    const drafts = (res.payload && res.payload.drafts) || [];
    if (!drafts.length) {
      fail(T.noDrafts);
      return;
    }

    drafts.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const d = drafts[0];

    let data;
    try {
      data = JSON.parse(d.plaintextBody || "");
    } catch (e) {
      fail(T.broken);
      return;
    }

    if (I18N[data.language]) {
      T = I18N[data.language];
      applyStatic();
    }
    labels = data.labels || { trash: null, done: null };
    dry = !!data.dryRun;

    const made = d.date
      ? new Date(d.date).toLocaleString(T.locale, { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "long" })
      : null;
    $("date").textContent = T.dateLine(data.date || "—", made);
    $("status").hidden = true;
    $("tiles").hidden = false;
    $("note").hidden = false;
    if (dry) $("note").textContent = T.dryNote + " " + T.note;
    if (!(labels.done && labels.done.id)) $("note").textContent += " " + T.noDoneLabel;
    $("bar").style.display = "block";

    $("t-marked").textContent = (data.marked || []).length;
    $("t-act").textContent = (data.act || []).length;
    $("t-unread").textContent = data.unreadTotal ?? "—";

    section("act", data.act);
    section("unread", data.unread);
    section("check", data.check);
    markedSection(data.marked);

    const foot = $("foot");
    foot.hidden = false;
    foot.textContent = T.foot;

    refresh();
  }

  load();
</script>
